<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- 老内核浏览器（不认 @layer/oklch/svh，如部分国产 OEM 浏览器旧 WebView）
         会整层丢弃 Tailwind v4 样式；此处用内联样式给出降级提示，不依赖外部 CSS。 -->
    <style>
      .legacy-browser-banner {
        display: none;
        background: #7c3aed;
        color: #fff;
        font:
          13px/1.6 system-ui,
          -apple-system,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        padding: 10px 14px;
        text-align: center;
      }
      html.legacy-browser .legacy-browser-banner {
        display: block;
      }
    </style>
    <script>
      ;(function () {
        try {
          var modern =
            window.CSS &&
            CSS.supports &&
            CSS.supports('color', 'oklch(50% 0.1 260)') &&
            CSS.supports('height', '100svh')
          if (!modern) {
            document.documentElement.className += ' legacy-browser'
          }
        } catch (e) {}
      })()
    </script>
    <!--Baidu Analytics-->
    <script>
      var _hmt = _hmt || []
      ;(function () {
        var hm = document.createElement('script')
        hm.src = 'https://hm.baidu.com/hm.js?96de375ddc55f28c9bec2cda74941ba8'
        var s = document.getElementsByTagName('script')[0]
        s.parentNode.insertBefore(hm, s)
      })()
    </script>
  </head>

  <body>
    <div class="legacy-browser-banner" role="alert">
      当前浏览器内核过旧，页面样式可能显示异常，建议改用微信内置浏览器、Chrome
      或更新系统浏览器。 / Your browser kernel is too old for this site's
      styles; please open in WeChat, Chrome, or an updated system browser.
    </div>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
